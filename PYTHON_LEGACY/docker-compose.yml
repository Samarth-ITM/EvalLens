services:
  evallens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evallens-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - EVALLENS_ENV=production
      - EVALLENS_ACCESS_PASSWORD=${EVALLENS_ACCESS_PASSWORD:-evallens2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - DB_PATH=/app/data/evallens.db
      - UPLOADS_PATH=/app/uploads
    volumes:
      - evallens-data:/app/data
      - evallens-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  evallens-data:
    driver: local
  evallens-uploads:
    driver: local
